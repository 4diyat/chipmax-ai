name: CI

on:
  push:
    branches: [main, "arena/**"]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: ruff + mypy + pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - name: Pasang pustaka sistem Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libgles2 libxkbcommon0 libdbus-1-3 libglib2.0-0 libfontconfig1

      - name: Pasang uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Sinkron dependensi terkunci
        run: uv sync --frozen --extra dev

      - name: Periksa requirements.txt sesuai lockfile
        run: |
          uv export --locked --no-dev --no-emit-project --no-hashes --output-file requirements.txt
          git diff --exit-code -- requirements.txt

      - name: Ruff
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Penanda typing PySide6
        run: uv run python tools/pyside6_typing.py

      - name: Mypy
        run: uv run mypy

      - name: Pytest
        run: uv run pytest -q

  windows-smoke:
    name: pytest (Windows, py3.12)
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Pasang uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Sinkron dependensi terkunci
        run: uv sync --frozen --extra dev

      - name: Kumpulkan tes
        timeout-minutes: 3
        run: uv run python -u -m pytest --collect-only -q

      - name: Tes pengaturan agen
        timeout-minutes: 3
        run: uv run python -u -m pytest -vv -s --color=no -p tools.windows_pytest jarvis_hands/tests/test_agent_settings.py

      - name: Tes agen Gemini
        timeout-minutes: 3
        run: uv run python -u -m pytest -vv -s --color=no -p tools.windows_pytest jarvis_hands/tests/test_gemini.py

      - name: Tes peluncur
        timeout-minutes: 3
        run: uv run python -u -m pytest -vv -s --color=no -p tools.windows_pytest jarvis_hands/tests/test_launch_scripts.py

      - name: Tes lainnya
        timeout-minutes: 5
        run: >-
          uv run python -u -m pytest -vv -s --color=no -p tools.windows_pytest
          --ignore=jarvis_hands/tests/test_agent_settings.py
          --ignore=jarvis_hands/tests/test_gemini.py
          --ignore=jarvis_hands/tests/test_launch_scripts.py
